name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Lint + Debug build
        run: gradle --no-daemon lintDebug assembleDebug

      - name: Size report
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          {
            echo "## APK sizes (bytes)"
            ls -l app/build/outputs/apk/*/*.apk | awk '{print $5, $9}'
            echo "## Release content (uncompressed / compressed)"
            unzip -lv "$APK" | awk 'NR>3 {print $1, $3, $8}'
            echo "## Release dex by package (defined only)"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only \
              --proguard-folder app/build/outputs/mapping/release "$APK" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BootDelay-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Release build (signed if secrets set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BootDelay-release
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
