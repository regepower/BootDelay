name: Size lab

# Experiment: builds the release APK in cumulative variants and prints one result line each.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/size-lab.yml"]

jobs:
  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "1-orig",            dexzip: 0, excl: 0, depinfo: 0, repack: 0, kflags: 0, rv: 1}
          - {name: "2-dexzip",          dexzip: 1, excl: 0, depinfo: 0, repack: 0, kflags: 0, rv: 1}
          - {name: "3-excludes",        dexzip: 1, excl: 1, depinfo: 0, repack: 0, kflags: 0, rv: 1}
          - {name: "4-depinfo",         dexzip: 1, excl: 1, depinfo: 1, repack: 0, kflags: 0, rv: 1}
          - {name: "5-repack",          dexzip: 1, excl: 1, depinfo: 1, repack: 1, kflags: 0, rv: 1}
          - {name: "6-kflags",          dexzip: 1, excl: 1, depinfo: 1, repack: 1, kflags: 1, rv: 1}
          - {name: "7-no-recyclerview", dexzip: 1, excl: 1, depinfo: 1, repack: 1, kflags: 1, rv: 0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply variant
        env:
          DEXZIP: ${{ matrix.dexzip }}
          EXCL: ${{ matrix.excl }}
          DEPINFO: ${{ matrix.depinfo }}
          REPACK: ${{ matrix.repack }}
          KFLAGS: ${{ matrix.kflags }}
          RV: ${{ matrix.rv }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess
          p = 'app/build.gradle.kts'
          s = open(p).read()
          if os.environ['DEXZIP'] == '0':
              s = s.replace('        dex { useLegacyPackaging = true }\n', '')
          if os.environ['EXCL'] == '0':
              s = re.sub(r'        resources \{\n            excludes[^\n]*\n        \}\n', '', s)
          if os.environ['DEPINFO'] == '0':
              s = re.sub(r'    dependenciesInfo \{.*?\n    \}\n', '', s, flags=re.S)
          if os.environ['KFLAGS'] == '0':
              s = re.sub(r'[^\n]*freeCompilerArgs\.addAll[^\n]*\n', '', s)
          if os.environ['REPACK'] == '0':
              open('app/proguard-rules.pro', 'w').write('')
          if os.environ['RV'] == '0':
              s = s.replace('    implementation("androidx.recyclerview:recyclerview:1.3.2")\n', '')
              src = subprocess.check_output(
                  ['git', 'show', 'bcfd3ac:app/src/main/java/de/regepower/bootdelay/MainActivity.kt'])
              open('app/src/main/java/de/regepower/bootdelay/MainActivity.kt', 'wb').write(src)
          open(p, 'w').write(s)
          EOF
          cat app/build.gradle.kts | sed -n '/packaging/,/lint/p'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Measure
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          AM="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$AM" dex packages --defined-only --proguard-folder app/build/outputs/mapping/release "$APK" > dex.txt || true
          pkg() { awk -F'\t' -v n="$1" '$1 ~ /^P/ && $4==n {print $3}' dex.txt | head -1; }
          DEX=$(unzip -lv "$APK" | awk '$8=="classes.dex" {print $1"/"$3}')
          ARSC=$(unzip -lv "$APK" | awk '$8=="resources.arsc" {print $1}')
          mkdir res
          printf '%-20s apk=%7s dex(raw/zip)=%-15s arsc=%5s defined=%7s androidx=%7s kotlin=%6s own=%6s\n' \
            "${{ matrix.name }}" "$(stat -c %s "$APK")" "$DEX" "$ARSC" "$(pkg '<TOTAL>')" "$(pkg androidx)" "$(pkg kotlin)" "$(pkg de)" \
            | tee "res/${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.name }}
          path: res/${{ matrix.name }}.txt

  report:
    needs: variant
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: res
          merge-multiple: true
      - name: Table
        run: |
          echo "=== SIZE LAB RESULT ==="
          cat res/*.txt | sort
          echo "=== END ==="
